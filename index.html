<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teste do Scraping</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #ffffff;
            color: #222;
        }


        h1 {
            margin-bottom: 30px;
        }


        h2 {
            margin-top: 30px;
        }


        h3 {
            margin-top: 25px;
        }


        pre {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            white-space: pre-wrap;
            overflow-x: auto;
        }


        .carregando {
            color: #666;
            font-style: italic;
        }


        .sucesso {
            color: green;
            font-weight: bold;
        }


        .erro {
            color: red;
            font-weight: bold;
        }

    </style>

</head>


<body>


    <h1>
        Teste do Scraping
    </h1>


    <div id="resultado-scraping">

        <p class="carregando">
            Carregando aplicação...
        </p>

    </div>


    <!-- =====================================================
         APP.JS É O PONTO DE ENTRADA
         ===================================================== -->

    <script>

        const versao =
            Date.now();


        console.log(
            "========================================"
        );


        console.log(
            "INDEX.HTML"
        );


        console.log(
            "Carregando app.js..."
        );


        console.log(
            "Versão:",
            versao
        );


        const scriptApp =
            document.createElement(
                "script"
            );


        scriptApp.src =
            "app.js?v=" +
            versao;


        scriptApp.onload =
            function () {

                console.log(
                    "app.js carregado."
                );

            };


        scriptApp.onerror =
            function () {

                console.error(
                    "ERRO ao carregar app.js."
                );


                const resultado =
                    document.querySelector(
                        "#resultado-scraping"
                    );


                if (resultado) {

                    resultado.innerHTML = `

                        <p class="erro">
                            ERRO ao carregar app.js.
                        </p>

                    `;

                }

            };


        document.body.appendChild(
            scriptApp
        );

    </script>


</body>

</html>
