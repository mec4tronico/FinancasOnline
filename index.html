<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teste de Scraping - StatusInvest</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #ffffff;
            color: #222;
        }


        h1 {
            margin-bottom: 30px;
        }


        h2 {
            margin-top: 30px;
            margin-bottom: 15px;
        }


        h3 {
            margin-top: 25px;
            margin-bottom: 10px;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }


        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }


        th {
            background: #f2f2f2;
        }


        .carregando {
            color: #666;
            font-style: italic;
        }


        pre {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            white-space: pre-wrap;
        }


        #resultado-scraping {
            margin-top: 30px;
        }

    </style>

</head>


<body>


    <h1>Carteira de Investimentos</h1>


    <!-- =====================================================
         TABELA 1 — CARTEIRA B3
         ===================================================== -->

    <h2>Carteira B3</h2>


    <table id="tabela-original">

        <thead>

            <tr>
                <th>Dados da Carteira</th>
            </tr>

        </thead>


        <tbody>

            <tr>

                <td class="carregando">
                    Carregando carteira...
                </td>

            </tr>

        </tbody>

    </table>


    <!-- =====================================================
         RESULTADO DO TESTE DO SCRAPING
         ===================================================== -->

    <div id="resultado-scraping">

        <h2>Teste do Scraping</h2>

        <p class="carregando">
            Aguardando execução...
        </p>

    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <!--
        scraping.js vem primeiro porque o app.js
        utiliza a função definida nele.
    -->

    <script src="scraping.js"></script>


    <!-- Aplicação principal -->

    <script src="app.js"></script>


</body>

</html>
