<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Carteira de Investimentos</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #ffffff;
            color: #222;
        }


        h1 {
            margin-bottom: 30px;
        }


        h2 {
            margin-top: 30px;
            margin-bottom: 15px;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }


        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }


        th {
            background: #f2f2f2;
        }


        .carregando {
            color: #666;
            font-style: italic;
        }


        .classe-erro {
            color: red;
            font-weight: bold;
        }


        #resultado-scraping {
            margin-top: 30px;
        }


        pre {
            background: #f5f5f5;
            padding: 15px;
            border: 1px solid #ddd;
            overflow-x: auto;
        }

    </style>

</head>


<body>


    <h1>Carteira de Investimentos</h1>


    <!-- =====================================================
         CARTEIRA B3
         ===================================================== -->

    <h2>Carteira B3</h2>


    <table id="tabela-original">

        <thead>

            <tr>

                <th>
                    Dados da Carteira
                </th>

            </tr>

        </thead>


        <tbody>

            <tr>

                <td class="carregando">

                    Carregando carteira...

                </td>

            </tr>

        </tbody>

    </table>


    <!-- =====================================================
         TESTE DO SCRAPING
         ===================================================== -->

    <div id="resultado-scraping">

        <h2>
            Teste do Scraping
        </h2>


        <p class="carregando">

            Testando scraping...

        </p>

    </div>


    <!-- =====================================================
         CARREGAMENTO DOS JAVASCRIPTS
         =====================================================

         Date.now() impede cache.

         Os dois arquivos são carregados diretamente.

         Não dependemos mais de scraping.js carregar
         o app.js.
    -->


    <script>

        const versao =
            Date.now();


        console.log(
            "========================================"
        );


        console.log(
            "CARREGANDO JAVASCRIPTS"
        );


        console.log(
            "Versão:",
            versao
        );


        // ----------------------------------------------------
        // SCRAPING.JS
        // ----------------------------------------------------

        const scriptScraping =
            document.createElement(
                "script"
            );


        scriptScraping.src =
            "scraping.js?v=" +
            versao;


        scriptScraping.onload =
            function () {

                console.log(
                    "scraping.js carregado."
                );

            };


        scriptScraping.onerror =
            function () {

                console.error(
                    "ERRO ao carregar scraping.js."
                );

            };


        document.body.appendChild(
            scriptScraping
        );


        // ----------------------------------------------------
        // APP.JS
        // ----------------------------------------------------

        const scriptApp =
            document.createElement(
                "script"
            );


        scriptApp.src =
            "app.js?v=" +
            versao;


        scriptApp.onload =
            function () {

                console.log(
                    "app.js carregado."
                );

            };


        scriptApp.onerror =
            function () {

                console.error(
                    "ERRO ao carregar app.js."
                );

            };


        document.body.appendChild(
            scriptApp
        );


        console.log(
            "Scripts adicionados à página."
        );

    </script>


</body>

</html>
