<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dados da Carteira</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #ffffff;
            color: #222;
        }

        h1 {
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 30px;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #f2f2f2;
        }

        .carregando {
            color: #666;
            font-style: italic;
        }

        .classe-erro {
            color: red;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <h1>Carteira de Investimentos</h1>


    <!-- ========================================================
         TABELA 1 — CARTEIRA B3
         ======================================================== -->

    <h2>Carteira B3</h2>

    <table id="tabela-original">

        <thead>
            <tr>
                <th>Dados da Carteira</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td class="carregando">
                    Carregando carteira...
                </td>
            </tr>

        </tbody>

    </table>


    <!-- ========================================================
         TABELA 2 — DADOS DE MERCADO
         ======================================================== -->

    <h2>Dados de Mercado</h2>

    <table id="tabela-scraping">

        <thead>

            <tr>
                <th>Ativo</th>
                <th>Valor Atual</th>
                <th>Mín. 52 Semanas</th>
                <th>Máx. 52 Semanas</th>
                <th>DY 12M</th>
                <th>Valorização 12M</th>
            </tr>

        </thead>

        <tbody>

            <tr>
                <td colspan="6" class="carregando">
                    Verificando dados de mercado...
                </td>
            </tr>

        </tbody>

    </table>


    <!-- ========================================================
         JAVASCRIPT
         ======================================================== -->

    <!-- Scraping deve ser carregado primeiro,
         pois escreverCSV.js depende dele. -->

    <script src="scraping.js"></script>

    <!-- Escrita/geração do CSV -->

    <script src="escreverCSV.js"></script>

    <!-- Aplicação principal -->

    <script src="app.js"></script>

</body>

</html>
:::
