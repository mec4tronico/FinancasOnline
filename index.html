<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Finanças Online</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        button {
            margin-right: 10px;
            padding: 8px 14px;
        }

        #status {
            margin: 20px 0;
            font-weight: bold;
        }

        #resultado {
            white-space: pre-wrap;
            background: #f5f5f5;
            padding: 15px;
        }

        table {
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 12px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 5px;
            white-space: nowrap;
        }

        th {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Finanças Online</h1>

    <button id="btnCarregar">
        Carregar patrimônio
    </button>

    <button id="btnScraping">
        Testar scraping AXIA3
    </button>

    <button id="btnBaixar">
        Baixar CSV atualizado
    </button>

    <div id="status">
        Inicializando...
    </div>

    <pre id="resultado"></pre>

    <table id="tabela"></table>

    <script
        type="module"
        src="./app.js">
    </script>

</body>

</html>
