<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste - Aba Patrimônio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #status {
            white-space: pre-wrap;
            margin: 15px 0;
            padding: 10px;
            background: #f1f1f1;
            border-radius: 6px;
        }

        #btnAtualizarMercado {
            padding: 10px 18px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        #btnAtualizarMercado:disabled {
            cursor: wait;
        }

        .tabela-container {
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 1800px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 6px 8px;
            white-space: nowrap;
        }

        th {
            background: #eee;
        }
    </style>
</head>

<body>

    <h1>Teste — Aba Patrimônio</h1>

    <div id="status">
        Inicializando...
    </div>

    <div class="tabela-container">
        <table id="tabela"></table>
    </div>

    <script type="module">

        import {
            iniciarAbaPatrimonio
        } from "./aba_patrimonio.js";

        iniciarAbaPatrimonio()
            .catch(erro => {

                console.error(
                    "Erro ao iniciar aba Patrimônio:",
                    erro
                );

                document.getElementById("status").textContent =
                    "ERRO: " + erro.message;
            });

    </script>

</body>

</html>
