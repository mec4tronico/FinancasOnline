<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste HTML StatusInvest</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 20px;
        }

        .controles {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input,
        select,
        button {
            padding: 10px;
            font-size: 14px;
        }

        input {
            width: 120px;
        }

        button {
            cursor: pointer;
        }

        #status {
            margin: 15px 0;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 700px;
            box-sizing: border-box;
            font-family: Consolas, monospace;
            font-size: 12px;
            white-space: pre;
        }
    </style>
</head>

<body>

    <h1>Teste — HTML bruto do StatusInvest</h1>

    <div class="controles">

        <label>
            Ticker:
            <input
                id="ticker"
                type="text"
                value="AXIA3"
            >
        </label>

        <label>
            Tipo:
            <select id="tipo">
                <option value="acoes">Ações</option>
                <option value="fii">FII</option>
            </select>
        </label>

        <button id="btnBuscar">
            Buscar HTML
        </button>

        <button id="btnSalvar">
            Salvar HTML
        </button>

    </div>

    <div id="status">
        Aguardando...
    </div>

    <textarea
        id="resultado"
        placeholder="O HTML bruto do StatusInvest aparecerá aqui..."
    ></textarea>


    <script>

        // ============================================================
        // CONFIGURAÇÃO
        // ============================================================

        const PROXY_CLOUDFLARE =
            "https://financasonline.augusto-gouveia2000.workers.dev/";


        const TIMEOUT_30_SEGUNDOS = 30000;


        let htmlRecebido = "";


        // ============================================================
        // BUSCAR HTML BRUTO
        // ============================================================

        async function buscarHTML() {

            const ticker =
                document
                    .getElementById("ticker")
                    .value
                    .trim()
                    .toUpperCase();

            const tipo =
                document
                    .getElementById("tipo")
                    .value;


            const status =
                document.getElementById("status");

            const resultado =
                document.getElementById("resultado");


            if (!ticker) {

                status.textContent =
                    "Informe um ticker.";

                return;
            }


            // --------------------------------------------------------
            // Definir endereço do StatusInvest
            // --------------------------------------------------------

            const categoria =
                tipo === "fii"
                    ? "fundos-imobiliarios"
                    : "acoes";


            const urlStatusInvest =
                `https://statusinvest.com.br/${categoria}/${ticker.toLowerCase()}`;


            // --------------------------------------------------------
            // Montar URL do Worker
            // --------------------------------------------------------

            const urlWorker =
                PROXY_CLOUDFLARE +
                "?url=" +
                encodeURIComponent(urlStatusInvest);


            status.textContent =
                "Buscando HTML do StatusInvest...";

            resultado.value = "";


            console.log(
                "StatusInvest:",
                urlStatusInvest
            );

            console.log(
                "Worker:",
                urlWorker
            );


            // --------------------------------------------------------
            // Timeout
            // --------------------------------------------------------

            const controlador =
                new AbortController();


            const timeout =
                setTimeout(
                    () => controlador.abort(),
                    TIMEOUT_30_SEGUNDOS
                );


            try {

                // ----------------------------------------------------
                // FETCH DO HTML BRUTO
                // ----------------------------------------------------

                const resposta =
                    await fetch(
                        urlWorker,
                        {
                            method: "GET",
                            cache: "no-store",
                            signal: controlador.signal
                        }
                    );


                clearTimeout(timeout);


                console.log(
                    "HTTP:",
                    resposta.status
                );


                if (!resposta.ok) {

                    throw new Error(
                        `Worker retornou HTTP ${resposta.status}`
                    );

                }


                // ----------------------------------------------------
                // LER HTML COMO TEXTO
                // ----------------------------------------------------

                htmlRecebido =
                    await resposta.text();


                if (!htmlRecebido) {

                    throw new Error(
                        "HTML recebido está vazio."
                    );

                }


                // ----------------------------------------------------
                // MOSTRAR HTML BRUTO
                // ----------------------------------------------------

                resultado.value =
                    htmlRecebido;


                status.textContent =
                    `HTML recebido com sucesso — ` +
                    `${htmlRecebido.length.toLocaleString("pt-BR")} caracteres.`;


                console.log(
                    "HTML recebido:",
                    htmlRecebido.length,
                    "caracteres"
                );


            }
            catch (erro) {

                clearTimeout(timeout);


                console.error(
                    erro
                );


                if (
                    erro.name ===
                    "AbortError"
                ) {

                    status.textContent =
                        "Erro: timeout de 30 segundos.";

                }
                else {

                    status.textContent =
                        "Erro: " +
                        erro.message;

                }

            }

        }


        // ============================================================
        // SALVAR HTML COMO ARQUIVO
        // ============================================================

        function salvarHTML() {

            if (!htmlRecebido) {

                alert(
                    "Primeiro busque o HTML."
                );

                return;
            }


            const blob =
                new Blob(
                    [htmlRecebido],
                    {
                        type: "text/html;charset=utf-8"
                    }
                );


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href = url;

            link.download =
                "statusinvest_html.html";


            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);


            URL.revokeObjectURL(url);

        }


        // ============================================================
        // EVENTOS
        // ============================================================

        document
            .getElementById("btnBuscar")
            .addEventListener(
                "click",
                buscarHTML
            );


        document
            .getElementById("btnSalvar")
            .addEventListener(
                "click",
                salvarHTML
            );


        // Permitir ENTER no ticker

        document
            .getElementById("ticker")
            .addEventListener(
                "keydown",
                evento => {

                    if (
                        evento.key ===
                        "Enter"
                    ) {

                        buscarHTML();

                    }

                }
            );

    </script>

</body>

</html>
